<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Best Plant Store</title>
    <meta name="description" content="Shop cacti, flowers and trees at The Best Plant Store, a point-of-sale web app built with HTML, CSS and JavaScript." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="./index.html" class="logo" aria-label="The Best Plant Store home">
        <i class="bx bxs-tree" aria-hidden="true"></i>
        <span>The Best Plant Store</span>
      </a>
      <a href="./cart.html" class="cart-link" aria-label="View cart">
        <i class="bx bx-cart" aria-hidden="true"></i>
        <span id="cart-count" class="cart-count" aria-live="polite" hidden>0</span>
      </a>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Plants for every personality.</h1>
        <p>From hungry fly traps to $4,000 fruit trees, we've got something green for you.</p>
      </section>

      <nav class="filters" aria-label="Filter by category">
        <button class="filter-btn active" data-category="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-category="tree" aria-pressed="false">Trees</button>
        <button class="filter-btn" data-category="flower" aria-pressed="false">Flowers</button>
        <button class="filter-btn" data-category="pointy" aria-pressed="false">Pointy/Ouchie</button>
      </nav>

      <section id="product-grid" class="product-grid" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <p>
        &copy; <span id="year"></span> The Best Plant Store &middot; Built by
        <a href="https://github.com/grif-wakeman">Grif</a>,
        <a href="https://github.com/ssevans12">Sara</a>,
        <a href="https://github.com/jgreener6">Justin</a> &amp;
        <a href="https://github.com/shelbysue">Shelby</a>
      </p>
      <p class="muted">Photos from <a href="https://unsplash.com">Unsplash</a>. This is a demo store; no real payments are processed.</p>
    </footer>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/store.js"></script>
    <script src="./js/shop.js"></script>
  </body>
</html>
